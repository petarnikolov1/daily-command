<style>
/* ── Tokens: "Calm instrument". Dark is default; light follows the system or a manual choice. ── */
:root {
  color-scheme: dark;
  --bg: #071419; --e1: #0C1E25; --e2: #12282F; --e3: #183139;
  --line: rgba(173,212,222,0.10); --line-strong: rgba(173,212,222,0.18); --stroke: #62808A;
  --text: #EAF2F4; --text-2: #A7BCC3; --text-3: #869FA7;
  --accent: #43C6D6; --on-accent: #04161B; --now: #F4B547; --success: #5AD19A; --danger: #F5877E;
  --accent-soft: rgba(67,198,214,0.14); --now-soft: rgba(244,181,71,0.14); --success-soft: rgba(90,209,154,0.14); --danger-soft: rgba(245,135,126,0.14);
  --hi: inset 0 1px 0 rgba(255,255,255,0.045);
  --shadow: none; --shadow-lg: 0 24px 64px rgba(0,0,0,0.45);
  --scrim: rgba(2,8,10,0.62); --glass: rgba(12,30,37,0.78);
  --c-teal: #3FC9BA; --c-blue: #6EA8F2; --c-violet: #A894F7; --c-rose: #F2819D; --c-green: #6CD39A; --c-sand: #E2B866; --c-slate: #93A6B0;
  --f-display: 'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;
  --f-ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-ctl: 8px; --r-row: 12px; --r-card: 20px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --t-press: 120ms; --t-state: 200ms; --t-sheet: 320ms;
  --gutter: 16px; --tab-h: 64px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #F5F3EE; --e1: #FFFFFF; --e2: #EFECE6; --e3: #E6E2DA;
  --line: rgba(14,34,41,0.10); --line-strong: rgba(14,34,41,0.16); --stroke: #6A7E84;
  --text: #0E2229; --text-2: #3E565E; --text-3: #4F656C;
  --accent: #096874; --on-accent: #FFFFFF; --now: #7C510E; --success: #156C47; --danger: #A8352F;
  --accent-soft: rgba(9,104,116,0.10); --now-soft: rgba(124,81,14,0.10); --success-soft: rgba(21,108,71,0.10); --danger-soft: rgba(168,53,47,0.10);
  --hi: none; --shadow: 0 1px 2px rgba(14,34,41,0.06), 0 4px 16px rgba(14,34,41,0.05); --shadow-lg: 0 24px 64px rgba(14,34,41,0.18);
  --scrim: rgba(14,34,41,0.36); --glass: rgba(255,255,255,0.8);
  --c-teal: #0E8576; --c-blue: #2C64C6; --c-violet: #6A4BD0; --c-rose: #BE3A62; --c-green: #1E8A5A; --c-sand: #946016; --c-slate: #586D77;
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F5F3EE; --e1: #FFFFFF; --e2: #EFECE6; --e3: #E6E2DA;
  --line: rgba(14,34,41,0.10); --line-strong: rgba(14,34,41,0.16); --stroke: #6A7E84;
  --text: #0E2229; --text-2: #3E565E; --text-3: #4F656C;
  --accent: #096874; --on-accent: #FFFFFF; --now: #7C510E; --success: #156C47; --danger: #A8352F;
  --accent-soft: rgba(9,104,116,0.10); --now-soft: rgba(124,81,14,0.10); --success-soft: rgba(21,108,71,0.10); --danger-soft: rgba(168,53,47,0.10);
  --hi: none; --shadow: 0 1px 2px rgba(14,34,41,0.06), 0 4px 16px rgba(14,34,41,0.05); --shadow-lg: 0 24px 64px rgba(14,34,41,0.18);
  --scrim: rgba(14,34,41,0.36); --glass: rgba(255,255,255,0.8);
  --c-teal: #0E8576; --c-blue: #2C64C6; --c-violet: #6A4BD0; --c-rose: #BE3A62; --c-green: #1E8A5A; --c-sand: #946016; --c-slate: #586D77;
}
[data-c="teal"] { --ic: var(--c-teal); } [data-c="blue"] { --ic: var(--c-blue); } [data-c="violet"] { --ic: var(--c-violet); }
[data-c="rose"] { --ic: var(--c-rose); } [data-c="green"] { --ic: var(--c-green); } [data-c="sand"] { --ic: var(--c-sand); } [data-c="slate"] { --ic: var(--c-slate); }
@media (min-width: 640px) { :root { --gutter: 24px; } }
@media (min-width: 1024px) { :root { --gutter: 32px; } }

/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; min-height: 100dvh; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 10px 14px; background: var(--accent); color: var(--on-accent); border-radius: var(--r-ctl); text-decoration: none; font-weight: 600; }
.skip:focus { top: calc(var(--sat) + 12px); }
.ic { stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; letter-spacing: -0.01em; }
.muted { color: var(--text-2); }
.grow { flex: 1 1 auto; min-width: 0; }
.display { font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: 1.02; letter-spacing: -0.01em; }
.display-num { font-family: var(--f-display); font-size: 34px; line-height: 1; }
.h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.h2 { font-size: 17px; font-weight: 600; }
.h3 { font-size: 17px; font-weight: 600; }
.lbl { font-size: 13px; color: var(--text-2); font-weight: 500; margin: 2px 0 8px; }
.overline { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-2); font-weight: 600; }
.c-success { color: var(--success); } .c-danger { color: var(--danger); } .c-now { color: var(--now); }
.link { color: var(--accent); text-decoration: none; font-weight: 500; }
.link:hover { text-decoration: underline; }
.link-sm { font-size: 13px; padding: 10px 0; display: inline-block; }
kbd { font-family: var(--f-mono); font-size: 12px; color: var(--text-3); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; }
.row-gap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }

/* ── Buttons ── */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-ctl); font-size: 15px; font-weight: 600; white-space: nowrap; transition: background var(--t-press) var(--ease), transform var(--t-press) var(--ease), color var(--t-press); text-decoration: none; user-select: none; -webkit-user-select: none; }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; gap: 6px; }
.btn-sm::after { content: ''; position: absolute; inset: -4px 0; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn-secondary { background: var(--e2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong), var(--hi); }
.btn-secondary:hover:not(:disabled) { background: var(--e3); }
.btn-ghost { color: var(--text-2); }
.btn-ghost:hover:not(:disabled) { background: var(--e2); color: var(--text); }
.btn-danger { color: var(--danger); background: var(--danger-soft); }
.btn-success { color: var(--success); background: var(--success-soft); }
.btn.is-busy { opacity: 0.7; }
.btn-t { overflow: hidden; text-overflow: ellipsis; }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-ctl); color: var(--text-2); transition: background var(--t-press), color var(--t-press), transform var(--t-press); flex: none; text-decoration: none; }
.iconbtn:hover:not(:disabled) { background: var(--e2); color: var(--text); }
.iconbtn:active:not(:disabled) { transform: scale(0.94); }
.iconbtn:disabled { opacity: 0.4; }
.iconbtn-sm { width: 36px; height: 36px; }
.iconbtn-sm::after { content: ''; position: absolute; inset: -4px; }
.iconbtn-primary { background: var(--accent); color: var(--on-accent); }
.iconbtn-primary:hover:not(:disabled) { background: var(--accent); color: var(--on-accent); filter: brightness(1.06); }
.iconbtn-secondary { background: var(--e2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.iconbtn-success { background: var(--success-soft); color: var(--success); }
.iconbtn-danger { background: var(--danger-soft); color: var(--danger); }
.iconbtn-badge { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
.mini-b { min-height: 32px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text); background: var(--e3); position: relative; }
.mini-b::after { content: ''; position: absolute; inset: -6px -2px; }

/* ── Segmented control, chips, badges ── */
.seg { display: inline-flex; padding: 3px; background: var(--e2); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg-b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 8px; color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap; flex: 1 0 auto; transition: background var(--t-state) var(--ease), color var(--t-state); }
.seg-b.on { background: var(--e1); color: var(--text); box-shadow: var(--hi), 0 0 0 1px var(--line-strong); }
.seg-sm .seg-b { min-height: 34px; padding: 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px; font-size: 13px; background: var(--e2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); text-decoration: none; position: relative; max-width: 100%; }
.chip-btn { cursor: pointer; font-weight: 500; }
.chip-btn::after { content: ''; position: absolute; inset: -6px -2px; }
.chip-btn:hover { background: var(--e3); }
.chip.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip-accent { background: var(--accent-soft); color: var(--text); box-shadow: none; }
.chip-item { box-shadow: inset 3px 0 0 var(--ic); }
.badge { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap; background: var(--e3); color: var(--text-2); }
.badge-new { background: var(--accent-soft); color: var(--accent); }
.badge-moved { background: var(--now-soft); color: var(--now); }
.badge-unchanged { background: var(--success-soft); color: var(--success); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }

/* ── Tick, progress ring, stepper ── */
.tick { position: relative; width: 44px; height: 44px; display: grid; place-items: center; flex: none; color: var(--ic, var(--accent)); }
.tick svg { width: 28px; height: 28px; overflow: visible; }
.tick-ring { fill: transparent; stroke: var(--stroke); stroke-width: 1.75; transition: fill var(--t-state), stroke var(--t-state); }
.tick-path { fill: none; stroke: var(--bg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset 180ms var(--ease); }
.tick:hover .tick-ring { stroke: var(--ic, var(--accent)); }
.tick.done .tick-ring { fill: var(--ic, var(--success)); stroke: var(--ic, var(--success)); }
.tick.done .tick-path { stroke-dashoffset: 0; }
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; }
.ring-bg { fill: none; stroke: var(--line-strong); }
.ring-fg { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 600ms var(--ease), stroke var(--t-state); }
.ring-success .ring-fg { stroke: var(--success); }
.ring-danger .ring-fg { stroke: var(--danger); }
.ring-item .ring-fg { stroke: var(--ic, var(--accent)); }
.ring-c { position: relative; display: grid; place-items: center; text-align: center; }
.ring-num { font-size: 17px; font-weight: 600; }
.ring-den { color: var(--text-3); font-size: 13px; }
.ring.is-won { filter: drop-shadow(0 0 10px rgba(90,209,154,0.35)); }
.ptick { position: relative; width: 44px; height: 44px; display: grid; place-items: center; flex: none; color: var(--ic, var(--accent)); }
.ptick-t { font-size: 12px; color: var(--text); }
.ptick-check { width: 18px; height: 18px; fill: none; stroke: var(--success); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ptick.done .ring-bg { stroke: var(--success-soft); }
.cc { display: flex; align-items: center; gap: 2px; flex: none; }
.cc-plus { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--e3); color: var(--text); position: relative; }
.cc-plus::after { content: ''; position: absolute; inset: -4px; }
.cc-plus.on { background: var(--now-soft); color: var(--now); }
.stepper { display: inline-flex; align-items: center; background: var(--e2); border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line-strong); }
.stepper-b { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--text); }
.stepper-b:disabled { opacity: 0.35; }
.stepper-v { min-width: 44px; text-align: center; font-size: 17px; }
.stepper-t { color: var(--text-3); font-size: 13px; }

/* ── Fields ── */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field-l { font-size: 13px; font-weight: 500; color: var(--text-2); }
.field-h { font-size: 12px; color: var(--text-3); line-height: 1.45; }
.field-ok { font-size: 13px; color: var(--success); margin-top: 6px; }
.form-err { color: var(--danger); font-size: 13px; margin: 4px 0 10px; }
.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--e1); border: 1px solid var(--stroke); color: var(--text); font-size: 15px; transition: border-color var(--t-press), box-shadow var(--t-press); -webkit-appearance: none; appearance: none; }
.input::placeholder { color: var(--text-3); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-sm { min-height: 36px; padding: 6px 10px; font-size: 13px; }
.input-lg { min-height: 52px; font-size: 17px; }
select.input { padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
.mono-soft { font-family: var(--f-mono); font-size: 13px; }
.input-time { width: 92px; text-align: center; font-size: 15px; }
.input-num { width: 92px; }
.input-date { width: auto; min-width: 150px; }
.field-bare { margin: 0; }
.field-bare .field-l { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.field-bare .input { border-color: transparent; background: transparent; padding-left: 0; font-size: 22px; font-weight: 600; min-height: 40px; }
.field-bare .input:focus { border-color: var(--accent); background: var(--e1); padding-left: 10px; }
.field-inline { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.switch-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; min-height: 52px; padding: 6px 0; cursor: pointer; }
.switch-row.is-disabled { opacity: 0.5; }
.switch-txt { display: flex; flex-direction: column; }
.switch-l { font-weight: 500; }
.switch-d { font-size: 13px; color: var(--text-2); }
.switch { appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--e3); box-shadow: inset 0 0 0 1px var(--stroke); position: relative; flex: none; cursor: pointer; transition: background var(--t-state); margin: 8px 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text-2); transition: transform var(--t-state) var(--ease), background var(--t-state); }
.switch:checked { background: var(--accent); box-shadow: none; }
.switch:checked::after { transform: translateX(20px); background: var(--on-accent); }
.secret { display: flex; gap: 6px; align-items: center; }
.colors { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.swatch::before { content: ''; width: 26px; height: 26px; border-radius: 50%; background: var(--ic); transition: transform var(--t-press); }
.swatch.on::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ic); }
.glyph { display: inline-grid; place-items: center; flex: none; border-radius: 50%; background: color-mix(in srgb, var(--ic, var(--accent)) 16%, transparent); font-size: 17px; line-height: 1; color: var(--ic); font-weight: 700; }
.glyph-md { width: 36px; height: 36px; }
.glyph-sm { width: 28px; height: 28px; font-size: 15px; }
.glyph-lg { width: 52px; height: 52px; font-size: 22px; }
.glyph-btn { cursor: pointer; box-shadow: inset 0 0 0 1px var(--line-strong); }
.glyphpick { position: relative; }
.glyphgrid { position: absolute; z-index: 30; top: 58px; left: 0; width: min(320px, calc(100vw - 48px)); background: var(--e2); border-radius: var(--r-row); box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--line-strong); padding: 10px; }
.glyphgrid-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); max-height: 220px; overflow-y: auto; margin: 8px 0; }
.glyphgrid-b { height: 44px; font-size: 22px; border-radius: var(--r-ctl); }
.glyphgrid-b:hover, .glyphgrid-b.on { background: var(--accent-soft); }
.glyphgrid-c { display: flex; gap: 6px; }

/* time pickers */
.timefield { position: relative; }
.timefield-b { cursor: pointer; }
.timefield-b.is-empty { color: var(--text-3); }
.timefield-p { position: absolute; z-index: 40; top: 50px; left: 50%; transform: translateX(-50%); background: var(--e2); border-radius: var(--r-row); box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--line-strong); padding: 8px; width: 200px; }
.wheels { display: flex; align-items: center; justify-content: center; gap: 4px; position: relative; }

/* ── Cards, sections, empty ── */

.skel { display: flex; flex-direction: column; gap: 10px; padding: 12px 0; }

@keyframes skel { to { background-position: -200% 0; } }

/* ── Shell ── */
.shell { min-height: 100dvh; }

.syncchip.is-saving .ic { color: var(--now); } .syncchip.is-synced .ic { color: var(--success); }
.syncchip.is-offline, .syncchip.is-error { color: var(--now); background: var(--now-soft); }
.syncchip-btn { color: var(--accent); background: var(--accent-soft); cursor: pointer; position: relative; }

.main { padding: 16px calc(var(--gutter) + var(--sar)) calc(var(--tab-h) + var(--sab) + 96px) calc(var(--gutter) + var(--sal)); max-width: calc(760px + 2 * var(--gutter)); margin: 0 auto; outline: none; }

.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + var(--sab)); padding: 0 calc(84px + var(--sar)) var(--sab) var(--sal); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--text-2); text-decoration: none; min-width: 0; }

.fab { position: fixed; right: calc(16px + var(--sar)); bottom: calc(var(--sab) + 4px); width: 60px; height: 60px; border-radius: 20px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 10px 28px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.25); transition: transform var(--t-press) var(--ease); z-index: 31; touch-action: manipulation; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }

.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }

.inspector { position: fixed; z-index: 25; top: 0; right: 0; bottom: 0; width: 420px; background: var(--e1); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 24px 40px; animation: slideL var(--t-sheet) var(--ease); }

.screen-h-sub { justify-content: flex-start; gap: 6px; }
.screen-h-sub .h1 { margin-right: auto; }
.splash { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }

/* ── Overlays ── */
.layer { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.layer-bg { position: absolute; inset: 0; background: var(--scrim); animation: fade var(--t-sheet) var(--ease); }
@keyframes fade { from { opacity: 0; } }
.sheet { position: relative; width: 100%; max-height: calc(100dvh - var(--sat) - 24px); background: var(--e1); border-radius: var(--r-card) var(--r-card) 0 0; box-shadow: var(--shadow-lg), var(--hi); display: flex; flex-direction: column; animation: up var(--t-sheet) var(--ease); transition: transform var(--t-sheet) var(--ease), max-height var(--t-sheet) var(--ease); padding-bottom: var(--sab); outline: none; }

.sheet-head { display: flex; align-items: center; gap: 8px; min-height: 52px; }

  .layer-panel, .layer-full { justify-content: flex-end; align-items: stretch; }

  .layer-panel .sheet-xl, .layer-full .sheet-xl { width: min(760px, 100vw); }
  .layer-panel.is-closing .sheet, .layer-full.is-closing .sheet { transform: translateX(40px); opacity: 0; }

}
@keyframes pop { from { transform: scale(0.97); opacity: 0; } }
.toasts { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + var(--sab) + 12px); display: flex; flex-direction: column; gap: 8px; width: min(440px, calc(100vw - 2 * var(--gutter))); pointer-events: none; }
.shell.is-desk ~ .toasts, .is-desk .toasts { bottom: 24px; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 6px 6px 16px; background: var(--e3); color: var(--text); border-radius: var(--r-row); box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--line-strong); animation: toastIn var(--t-state) var(--ease); font-size: 15px; position: relative; overflow: hidden; }

.toast-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
.toast-bar-f { height: 100%; background: var(--accent); transform-origin: left; transition: transform 300ms var(--ease); }

/* menus */

.menu-i:hover, .menu-i:focus-visible { background: var(--e3); }
.menu-i.danger { color: var(--danger); }

.menu-list .btn { justify-content: flex-start; }

/* ── Today ── */
.today-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 6px; }

.now-in { color: var(--now); font-size: 13px; }
.nowcard.is-live { box-shadow: var(--hi), var(--shadow), inset 0 0 0 1px var(--line), inset 3px 0 0 var(--now); }
.nowcard-bar { height: 4px; border-radius: 2px; background: var(--line-strong); margin: 14px 0 10px; overflow: hidden; }
.nowcard-bar-f { height: 100%; background: var(--now); transform-origin: left; transition: transform 600ms var(--ease); }
.nowcard-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }

.sec.is-won { border-radius: var(--r-card); }

/* rows */

.nowline::after { content: ''; position: absolute; left: 40px; top: calc(50% - 4px); width: 9px; height: 9px; border-radius: 50%; background: var(--now); }

/* item sheet */

.tl-bm { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 4px 8px 4px 10px; text-align: left; gap: 1px; touch-action: pan-y; cursor: grab; }
.tl-bt { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; max-width: 100%; }
.tl-bn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-bg { flex: none; }

.cat-pick .cat-dot { width: 14px; height: 14px; }
.todo-l { display: flex; flex-direction: column; gap: 2px; touch-action: pan-y; }
.todo { display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 2px 0 2px 2px; border-radius: var(--r-ctl); transition: background var(--t-state); }
.todo.is-drag { background: var(--e3); box-shadow: var(--shadow-lg); }
.todo.is-over { box-shadow: inset 0 2px 0 var(--accent); }
.todo-grip { width: 24px; height: 44px; display: grid; place-items: center; color: var(--text-3); cursor: grab; touch-action: none; flex: none; }
.todo-cb { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0 4px; cursor: pointer; }
.todo-t { flex: 1; min-width: 0; text-align: left; min-height: 44px; font-size: 15px; overflow-wrap: anywhere; }
.todo-edit { flex: 1; }
.todo.is-done .todo-t { color: var(--text-3); text-decoration: line-through; }
.todo-rules { font-size: 12px; margin-top: 14px; }
.notes-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.notes-d { flex: 1; text-align: center; min-width: 160px; }
.notes-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .notes-grid { grid-template-columns: 1fr 1fr; } }
.note-card .field { margin: 0; }
.note-week { margin-top: 12px; }
.notes-wnav { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.notes-wnav .lbl { margin: 0; }

/* ── Progress ── */
.rings30 { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px 4px; }
.ring30 { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; font-size: 12px; color: var(--text-2); }
.bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; align-items: end; }
.barcol { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; }
.barcol-b { width: 100%; max-width: 36px; height: 96px; border-radius: 6px; background: var(--e2); display: flex; align-items: flex-end; overflow: hidden; }
.barcol-f { width: 100%; height: 100%; background: var(--accent); transform-origin: bottom; transition: transform 600ms var(--ease); }
.barcol .muted { font-size: 12px; white-space: nowrap; }
.streaks { display: flex; flex-direction: column; gap: 4px; }
.streak-r { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 10px; border-radius: var(--r-row); background: var(--e1); box-shadow: inset 3px 0 0 var(--ic), inset 0 0 0 1px var(--line); text-decoration: none; }
.streak-n { font-size: 17px; }
.streak-r .ic { color: var(--now); }
.statgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
@media (min-width: 640px) { .statgrid { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--e1); border-radius: var(--r-row); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--hi), inset 0 0 0 1px var(--line); }
.stat .muted { font-size: 13px; }
.yvy-head { font-size: 34px; line-height: 1.1; margin-bottom: 6px; }
.yvy-motto { font-size: 13px; margin-bottom: 8px; }
.yvy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; position: relative; }
.yc { aspect-ratio: 1; min-height: 34px; border-radius: 6px; background: var(--e2); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--text-2); display: grid; place-items: center; touch-action: manipulation; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.yc.is-won { background: var(--success-soft); box-shadow: inset 0 0 0 1px var(--success); color: var(--success); }
.yc.is-lost { background: var(--danger-soft); box-shadow: inset 0 0 0 1px var(--danger); color: var(--danger); }
.yc.is-fut { opacity: 0.35; }
.yc.is-today { outline: 2px solid var(--accent); outline-offset: 1px; }
.yc.is-manual::after { content: ''; position: absolute; }
.yvy-legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 12px; font-size: 12px; }
.yvy-legend .muted { font-size: 12px; }
.yc-sw { width: 14px; height: 14px; border-radius: 4px; background: var(--e2); box-shadow: inset 0 0 0 1px var(--line-strong); display: inline-block; }
.yc-sw.is-won { background: var(--success-soft); box-shadow: inset 0 0 0 1px var(--success); }
.yc-sw.is-lost { background: var(--danger-soft); box-shadow: inset 0 0 0 1px var(--danger); }
.yvy-tip { position: sticky; bottom: calc(var(--tab-h) + var(--sab) + 12px); margin-top: 10px; background: var(--e3); border-radius: var(--r-ctl); padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow-lg); width: fit-content; max-width: 100%; }

/* ── More, quiz, videos, settings ── */
.morelist { display: flex; flex-direction: column; gap: 8px; }
.morelink { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r-card); background: var(--e1); box-shadow: var(--hi), var(--shadow), inset 0 0 0 1px var(--line); text-decoration: none; min-height: 72px; }
.morelink:hover { background: var(--e2); }
.morelink-i { width: 44px; height: 44px; border-radius: var(--r-row); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.morelink-t { display: block; font-weight: 600; }
.morelink .muted { font-size: 13px; }
.dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 40px 20px; border-radius: var(--r-card); border: 1.5px dashed var(--stroke); color: var(--text-2); cursor: pointer; min-height: 200px; }
.dropzone strong { color: var(--text); font-size: 17px; }
.dropzone.is-over { border-color: var(--accent); background: var(--accent-soft); }
.dropzone:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.quiz-ready { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.quiz-rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-2); }
.quiz-timer { font-size: 22px; color: var(--text); }
.quiz-timer.is-warn { color: var(--now); } .quiz-timer.is-danger { color: var(--danger); }
.quiz-q { margin: 14px 0; }
.quiz-qt { font-size: 17px; font-weight: 600; margin-bottom: 14px; line-height: 1.45; }
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-o { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px; min-height: 52px; border-radius: var(--r-row); background: var(--e2); box-shadow: inset 0 0 0 1px var(--line); }
.quiz-o.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.quiz-l { width: 26px; height: 26px; border-radius: 50%; background: var(--e3); display: grid; place-items: center; font-size: 13px; flex: none; }
.quiz-o.on .quiz-l { background: var(--accent); color: var(--on-accent); }
.quiz-nav { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.quiz-score { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 10px 0; }
.quiz-review { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.qr { padding: 14px; }
.qr.is-ok { box-shadow: var(--hi), inset 3px 0 0 var(--success), inset 0 0 0 1px var(--line); }
.qr.is-bad { box-shadow: var(--hi), inset 3px 0 0 var(--danger), inset 0 0 0 1px var(--line); }
.qr-s { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.qr-o { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; font-size: 13px; }
.qr-o li { padding: 6px 8px; border-radius: 6px; background: var(--e2); }
.qr-o li.is-correct { background: var(--success-soft); color: var(--text); }
.qr-o li.is-chosen { background: var(--danger-soft); }
.qr-e { font-size: 13px; }
.qtrack { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.qt { padding: 0; }
.qt-h { display: flex; gap: 10px; align-items: center; width: 100%; padding: 12px 14px; text-align: left; min-height: 52px; font-size: 13px; }
.qt-h .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qt-dots { display: flex; gap: 2px; }
.qd { width: 6px; height: 14px; border-radius: 2px; background: var(--e3); }
.qd.c { background: var(--success); } .qd.w { background: var(--danger); } .qd.s { background: var(--now); }
.qt-b { padding: 0 14px 14px; }
.vlist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.vrow { padding: 12px; }
.vrow.is-correct { box-shadow: var(--hi), inset 3px 0 0 var(--success), inset 0 0 0 1px var(--line); }
.vrow.is-incorrect { box-shadow: var(--hi), inset 3px 0 0 var(--danger), inset 0 0 0 1px var(--line); }
.vrow-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.vrow-n { font-size: 15px; font-weight: 600; min-width: 44px; }
.vrow-b { display: flex; gap: 6px; align-items: center; }
.setnav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.setsec { margin-bottom: 16px; scroll-margin-top: 80px; }
.setsec > .h3 { margin-bottom: 4px; }
.setsec > .muted { font-size: 13px; margin-bottom: 14px; }
.acct { display: flex; gap: 12px; align-items: center; margin: 10px 0; }
.guide { margin: 12px 0; border-radius: var(--r-row); background: var(--e2); padding: 0 14px; }
.guide > summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; font-weight: 600; font-size: 13px; list-style: none; }
.guide > summary::-webkit-details-marker { display: none; }
.guide > summary::after { content: '+'; margin-left: auto; font-family: var(--f-mono); color: var(--text-2); }
.guide[open] > summary::after { content: '–'; }
.guide[open] { padding-bottom: 12px; }
.selftest { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 16px; }
.st { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; }
.st-i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.st.is-ok .st-i { background: var(--success-soft); color: var(--success); }
.st.is-bad .st-i { background: var(--danger-soft); color: var(--danger); }
.st-n { font-weight: 600; font-size: 15px; }
.st-d { font-size: 13px; overflow-wrap: anywhere; }
.selftest-sum { font-size: 22px; font-weight: 600; }

/* auth */
.auth { min-height: 100dvh; display: grid; place-items: center; padding: calc(var(--sat) + 24px) var(--gutter) calc(var(--sab) + 24px); }
.auth-card { width: min(420px, 100%); padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; }
.auth-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.auth-brand .display { font-size: 44px; }
.auth .seg { width: 100%; }
.auth-forgot { align-self: flex-end; margin-top: -10px; color: var(--text-2); }

@media (max-width: 380px) { .display { font-size: 34px; } .nine-d { min-height: 56px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-property: opacity !important; transition-duration: 150ms !important; scroll-behavior: auto !important; }
  .sheet, .main.enter > .screen, .toast, .menu-p, .inspector { animation-name: fade !important; animation-duration: 200ms !important; }
}

/* DECISIONS
 1 Stack: Preact + htm (standalone module). One store: dispatch(action) → reducer → new immutable data. Undo = automatic inverse patch of exactly the keys an action touched.
 2 Tree: App → Auth | Recovery | Shell(Rail or TabBar+FAB, Screen, Inspector, Layers, Toasts). Screens: Today, Plan (day/week/month), Lists, Progress, More, Settings, SelfTest.
 3 Store: {phase, session, data (schema 2), route, clock{now,today}, sync, gcal, apple, ui{layers,toasts,focusKey}}. The hash route is the only selected date.
 4 Scheduling = item rule + one exception per item/date. Indexes are memoised by object identity, so month and week views stay fast.
 5 Migration replays the verbatim legacy isSched on every date a v1 layer touched and writes added/skipped where the new rule differs. `done` is written only where the
   legacy and new results disagree (a timer that met its target but was never tapped stays not-done, exactly as before). Legacy events become kind 'event'.
 6 Colours: amber→sand, purple→violet, red/pink→rose, muted→slate. Legacy link actions (openVideoModal) become #/more/videos links.
 7 Sync: merge per item/exception/to-do/note by updatedAt with tombstones (pruned after 90 days); other sections by sectionsUpdatedAt. Saves stamp meta.rev/writer, so echoes
   are recognised by content (the old 3-second window also swallowed real edits). A v1 blob written by an older client is migrated with epoch timestamps and merged, so it never beats newer edits.
 8 Cloud boot never writes before a successful load; on failure it opens the last cached copy (offline) or shows Retry. Nothing is upserted from an empty state.
 9 Added fields: todos.archive, meta (rollover markers, rev), tombstones, sectionsUpdatedAt, plans[date].prior/createdItemIds/constraints (exact revert of a plan).
10 To-dos: at rollover, unfinished Today items get carriedFrom; finished ones from earlier days are archived. The Monday rule starts from the first Monday after first run.
11 You vs You: auto verdicts are derived from Top 3 when shown (manual wins); nothing is written behind the user's back. Headline defaults to the old caption; old grid line = motto.
12 Completion: one tap toggles done for every type and keeps progress; count/duration also complete at target. Starting a timer stops any other.
13 .ics keeps the old VEVENT/VALARM rules; the "None" reminder now omits the alarm (it silently used 09:00). X-WR-TIMEZONE is the user's timezone.
14 Google: payloads built from occurrences, same UIDs/private fields. Anytime = all-day with no popup; optional nudge UID …-nudge@dc. Account email comes from calendars/primary
   with a bearer header (no tokens in URLs). GIS is preloaded once a client ID exists so Connect/Reconnect taps stay user gestures.
15 AI: items the model neither places nor skips stay on the day; blocks reusing previous AI one-offs are recreated, so re-planning never duplicates. Constraints are kept per date.
16 AI profile: the old template's ${dayName} became {date}, replaced per request. Imported text is labelled until saved. Secrets adopt old keys once, for the first account.
17 Apple Reminders proxy contract unchanged (lists sent as daily/weekly/unscheduled). Quick Add picks an existing repeating item and schedules it instead of duplicating it.
18 Week view: 7-column timeline on desktop, day agenda on phones; moving across days uses Move (date + time). Videos default 1–52; Open uses an optional folder link.
19 Contrast: dark text-3 lifted to #869FA7 and light accent/now/success/danger darkened so text passes 4.5:1 on every surface and tint; dimmed states use colour,
   not opacity. A --stroke token (≥3:1) is used for control borders, --line only for decorative dividers.
*/

      let over = lis.length;

  };

  const items = keys.map(k => { const d = track[k]; const n = d.history.length, c = d.history.filter(x => x.correct).length; tot += n; cor += c; const rate = n ? c / n : 0; if (rate < 0.5 && n >= 2) weak++; if (n > 0 && c === n) perfect++; return { k, ...d, n, c, rate }; })
    .sort((a, b) => a.rate - b.rate || b.n - a.n)
    .filter(d => (f === 'all' || (f === 'mistakes' && d.n > 0 && d.c < d.n) || (f === 'perfect' && d.n > 0 && d.c === d.n) || (f === 'weak' && d.rate < 0.5 && d.n >= 2) || (f === 'once' && d.n === 1)) && (!q || d.q.toLowerCase().includes(q.toLowerCase())));
  const L = ['A', 'B', 'C', 'D', 'E'];
  return html`<${Section} id="qt" title=${t('quiz.tracker')}>
    <div class="statgrid"><div class="stat"><span class="display-num">${keys.length}</span><span class="muted">${t('quiz.seen')}</span></div><div class="stat"><span class="display-num">${tot ? Math.round(cor / tot * 100) : 0}%</span><span class="muted">${t('quiz.accuracy')}</span></div><div class="stat"><span class="display-num c-danger">${weak}</span><span class="muted">${t('quiz.weak')}</span></div><div class="stat"><span class="display-num c-success">${perfect}</span><span class="muted">${t('quiz.perfect')}</span></div></div>
    <div class="chips-row">${[['all', t('quiz.fAll')], ['mistakes', t('quiz.fMistakes')], ['perfect', t('quiz.fPerfect')], ['weak', t('quiz.fWeak')], ['once', t('quiz.fOnce')]].map(([v, l]) => html`<${Chip} selected=${f === v} onClick=${() => setF(v)}>${l}<//>`)}</div>
    <input class="input" placeholder=${t('quiz.search')} aria-label=${t('quiz.search')} value=${q} onInput=${e => setQ(e.currentTarget.value)} />
    <ul class="qtrack">${items.slice(0, 200).map(d => html`<li class="card qt">
      <button type="button" class="qt-h" aria-expanded=${open === d.k} onClick=${() => setOpen(open === d.k ? null : d.k)}><span class="grow">${d.q}</span><span class="qt-dots" aria-hidden="true">${d.history.slice(-10).map(x => html`<span class=${'qd ' + (x.skipped ? 's' : x.correct ? 'c' : 'w')}></span>`)}</span><span class="mono">${d.c}/${d.n}</span></button>
      ${open === d.k && html`<div class="qt-b"><ul class="qr-o">${(d.options || []).map((o, i) => html`<li class=${i === d.correctIdx ? 'is-correct' : ''}><span class="mono">${L[i]}.</span> ${o}</li>`)}</ul>${d.explanation && html`<p class="muted">${d.explanation}</p>`}
        <div class="chips-row">${d.history.map(x => html`<${Badge} tone=${x.skipped ? 'neutral' : x.correct ? 'unchanged' : 'danger'}>${x.skipped ? t('quiz.skipped1') : x.correct ? t('quiz.correct1') : t('quiz.wrong1')} · ${new Date(x.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}<//>`)}</div></div>`}
    </li>`)}${!items.length && html`<p class="muted">${t('quiz.noMatch')}</p>`}</ul>
  <//>`;
}

function VideoAnswer({ n, v, onSave }) {
  const [a, setA] = useState(v.answer || '');

function VideoTest({ test, setTest }) {
  const data = useData();
  const done = test.cur >= test.list.length;
  const n = test.list[test.cur];
  const submit = res => {
    const v = data.videos[n] || {};
    const mistakes = (v.mistakes || 0) + (res === 'incorrect' ? 1 : 0);
    dispatch({ type: 'video/set', n, patch: { result: res, watched: true, answer: test.ans || v.answer || '', mistakes } });
    setTest({ ...test, cur: test.cur + 1, ans: '', mistakes: res === 'incorrect' ? [...test.mistakes, { n, answer: test.ans, count: mistakes }] : test.mistakes });
  };
  const corr = test.list.length - test.mistakes.length;
  return html`<${Sheet} title=${done ? t('videos.testDone') : t('quiz.qOf', { n: test.cur + 1, total: test.list.length })} onClose=${() => setTest(null)} size="md">
    ${done ? html`<div class="quiz-score"><span class="display-num">${Math.round(corr / test.list.length * 100)}%</span><span class="muted">${t('videos.testSummary', { c: corr, n: test.list.length, m: test.mistakes.length })}</span></div>

    : html`<div class="bar"><div class="bar-f" style=${`transform:scaleX(${test.cur / test.list.length})`}></div></div>
      <p class="h3">${t('videos.videoN', { n })}</p><p class="muted">${t('videos.question')}</p>
      <input class="input" autofocus placeholder=${t('videos.answerPh')} aria-label=${t('videos.answerFor', { n })} value=${test.ans} onInput=${e => setTest({ ...test, ans: e.currentTarget.value })} onKeyDown=${e => { if (e.key === 'Enter') submit('correct'); }} />

function friendlyAuthError(err) {
  if (!err) return t('auth.unknown');
  const raw = String(err.message || err).toLowerCase();
  if (raw.includes('<html') || raw.includes('unexpected token') || raw.includes('is not valid json')) return t('auth.unreachable');
  if (raw.includes('invalid login credentials') || raw.includes('invalid email or password')) return t('auth.badCreds');
  if (raw.includes('email not confirmed')) return t('auth.confirmFirst');
  if (raw.includes('already registered')) return t('auth.exists');
  if (raw.includes('password should be') || raw.includes('at least')) return t('auth.pwShort');
  if (raw.includes('rate limit') || raw.includes('too many')) return t('auth.tooMany');
  if (raw.includes('network') || raw.includes('fetch')) return t('auth.network');
  return err.message || t('auth.unknown');
}

let _routeHistoryDepth = 0;
function parseHash(h, today = S.state.clock.today) {
  const parts = String(h || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const d = x => (isDateKey(x) ? x : null);
  switch (parts[0]) {
    case 'today': return { screen: 'today', date: d(parts[1]) || today, explicit: !!d(parts[1]) };
    case 'plan': { const view = ['day', 'week', 'month'].includes(parts[1]) ? parts[1] : 'day'; return { screen: 'plan', view, date: d(parts[2]) || today, explicit: !!d(parts[2]) }; }
    case 'lists': return { screen: 'lists', sub: parts[1] === 'notes' ? 'notes' : 'todos', date: d(parts[2]) || today, explicit: !!d(parts[2]) };
    case 'progress': return { screen: 'progress' };
    case 'more': return { screen: 'more', sub: ['quiz', 'videos', 'reading', 'routines'].includes(parts[1]) ? parts[1] : null };
    case 'settings': return { screen: 'settings', section: SETTINGS_SECTIONS.includes(parts[1]) ? parts[1] : null };
    case 'item': return parts[1] ? { screen: 'item', itemId: parts[1], date: d(parts[2]) || today } : { screen: 'today', date: today };
    case 'selftest': return { screen: 'selftest' };
    default: return { screen: 'today', date: today, explicit: false };
  }
}
function routeHash(r) {
  switch (r.screen) {
    case 'today': return r.explicit ? `#/today/${r.date}` : '#/today';
    case 'plan': return `#/plan/${r.view}/${r.date}`;
    case 'lists': return r.sub === 'notes' ? `#/lists/notes${r.explicit ? '/' + r.date : ''}` : '#/lists/todos';
    case 'more': return r.sub ? `#/more/${r.sub}` : '#/more';
    case 'settings': return r.section ? `#/settings/${r.section}` : '#/settings';
    case 'item': return `#/item/${encodeURIComponent(r.itemId)}/${r.date}`;
    default: return '#/' + r.screen;
  }
}
let _bgRoute = null;
function syncRoute() {
  if (/access_token=|type=recovery|error_description=/.test(location.hash)) return;
  const r = parseHash(location.hash);
  if (r.screen === 'item') { r.bg = _bgRoute || { screen: 'today', date: S.state.clock.today }; r.back = routeHash(r.bg); }
  else _bgRoute = r;
  patchState({ route: r });
  if (r.screen !== 'item') { const main = document.getElementById('main'); if (main && !reducedMotion()) { main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter'); } window.scrollTo(0, 0); }
}
function navigate(hash) {
  if (location.hash === hash) { syncRoute(); return; }
  _routeHistoryDepth++;
  location.hash = hash;
}
addEventListener('hashchange', () => { syncRoute(); });
function routeOnDayChange(prev, today) {
  const r = S.state.route;

  if (r && r.screen === 'today' && r.explicit && r.date === prev) navigate('#/today');

async function runSelfTests() {
  const res = [];
  for (const [name, fn] of SELF_TESTS) {
    const t0 = performance.now();
    try { const detail = await fn(); res.push({ name, ok: true, detail: detail || '', ms: Math.round(performance.now() - t0) }); }
    catch (e) { res.push({ name, ok: false, detail: e && e.message ? e.message : String(e), ms: Math.round(performance.now() - t0) }); }
  }
  window.__selftest = res;
  return res;
}
function SelfTestScreen() {
  const [res, setRes] = useState(null);
  useEffect(() => { let alive = true; runSelfTests().then(r => alive && setRes(r)); return () => { alive = false; }; }, []);
  const pass = res ? res.filter(r => r.ok).length : 0;
  return html`<div class="screen screen-selftest"><${SubHeader} title=${t('dev.selftest')} back="#/settings/advanced" />
    ${!res ? html`<${Skeleton} lines=${6} />` : html`<p class=${cx('selftest-sum', pass === res.length ? 'c-success' : 'c-danger')} role="status" data-pass=${pass} data-total=${res.length}>${t('dev.passed', { pass, total: res.length })}</p>
      <ol class="selftest">${res.map((r, i) => html`<li class=${cx('card st', r.ok ? 'is-ok' : 'is-bad')}><span class="st-i"><${Icon} n=${r.ok ? 'check' : 'x'} /></span><div class="grow"><div class="st-n">${i + 1}. ${r.name}</div><div class="muted st-d">${r.detail}</div></div><span class="mono muted">${r.ms} ms</span></li>`)}</ol>
      <${Button} icon="refresh" onClick=${() => { setRes(null); runSelfTests().then(setRes); }}>${t('dev.rerun')}<//>`}
  </div>`;
}
